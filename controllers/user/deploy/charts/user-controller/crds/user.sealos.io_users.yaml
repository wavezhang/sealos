apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: users.user.sealos.io
spec:
  group: user.sealos.io
  names:
    kind: User
    listKind: UserList
    plural: users
    singular: user
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.observedCSRExpirationSeconds
          name: ExpirationSeconds
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1
      schema:
        openAPIV3Schema:
          description: User is the Schema for the users API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: UserSpec defines the desired state of User
              properties:
                csrExpirationSeconds:
                  default: 604800
                  description: |-
                    expirationSeconds is the requested duration of validity of the issued
                    kubeconfig credential. The issuer may issue a credential with a different
                    validity duration so a client must check the issued credential to determine
                    the actual duration.
                    
                    
                    The effective lifetime is clamped when the credential is issued: values
                    below 600 seconds (including 0) use the default of 604800 seconds (7 days),
                    and values above 2592000 seconds (30 days) are reduced to 2592000 seconds.
                    The controller renews the kubeconfig at half of the effective lifetime.
                  format: int32
                  type: integer
                kubeConfigRotateAt:
                  description: kubeConfigRotateAt is a manual trigger for kubeconfig
                    rotation. When set/updated, controller will request a new token
                    and recreate kubeconfig.
                  format: date-time
                  type: string
              type: object
            status:
              description: UserStatus defines the observed state of User
              properties:
                conditions:
                  description: Conditions contains the different condition statuses
                    for this user.
                  items:
                    properties:
                      lastHeartbeatTime:
                        description: LastHeartbeatTime is the last time this condition
                          was updated.
                        format: date-time
                        type: string
                      lastTransitionTime:
                        description: LastTransitionTime is the last time the condition
                          changed from one status to another.
                        format: date-time
                        type: string
                      message:
                        description: Message is a human-readable message indicating
                          details about the last status change.
                        type: string
                      reason:
                        description: Reason is a (brief) reason for the condition's
                          last status change.
                        type: string
                      status:
                        description: Status is the status of the condition. One of True,
                          False, Unknown.
                        type: string
                      type:
                        type: string
                    required:
                      - status
                      - type
                    type: object
                  type: array
                kubeConfig:
                  type: string
                observedCSRExpirationSeconds:
                  default: 604800
                  format: int32
                  type: integer
                observedKubeConfigRotateAt:
                  description: ObservedKubeConfigRotateAt records the last processed
                    rotation request.
                  format: date-time
                  type: string
                kubeConfigRefreshAt:
                  description: |-
                    KubeConfigRefreshAt is the next time the controller should refresh the
                    kubeconfig token: half of the lifetime of the currently issued credential.
                    It is persisted so a controller restart keeps the token refresh schedule
                    without retaining the kubeconfig payload in cache.
                  format: date-time
                  type: string
                observedKubeConfigSecretUID:
                  description: ObservedKubeConfigSecretUID identifies the Secret bound
                    to the current kubeconfig token.
                  type: string
                observedGeneration:
                  description: The generation observed by the user controller.
                  format: int64
                  type: integer
                phase:
                  default: Unknown
                  description: Phase is the recently observed lifecycle phase of user
                  type: string
              required:
                - kubeConfig
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
