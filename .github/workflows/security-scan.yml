# Automated security scanning for this sealos fork.
#
# Layers:
#   - gitleaks      : secret detection (full history report + diff gate)
#   - Trivy         : dependency / IaC / secret scanning (SARIF + HIGH/CRITICAL gate)
#   - govulncheck   : reachable Go vulnerabilities per module (SARIF + gate)
#   - CodeQL        : deep data-flow analysis for Go and TypeScript (SARIF)
#   - dependency-review: blocks PRs that introduce HIGH/CRITICAL dependencies
#                       (advisory only on this fork: no dependency graph for forks)
#
# Policy: every job uploads SARIF to the Security > Code scanning tab.
#   - main pushes and the weekly schedule run the repo-wide gates: any fixed
#     HIGH/CRITICAL vulnerability or reachable Go vulnerability fails the run, so
#     the existing upstream debt stays visible and is tracked to zero.
#   - pull requests only hard-fail on secrets in the commits they add; dependency
#     and Go findings are left to GitHub's code scanning check, which fails a PR
#     only when it introduces *new* alerts. Otherwise the hundreds of pre-existing
#     upstream CVEs would block every pull request.
#   - full-history secret findings are report-only (upstream history cannot be fixed
#     here). Gates only block merges once branch protection requires this workflow.

name: Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Every Monday 02:00 UTC, so newly disclosed CVEs are picked up without a push.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"
  GITLEAKS_VERSION: "8.30.1"
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSLf --retry 3 --retry-delay 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history (weekly report only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          gitleaks git --redact --no-banner \
            --report-format sarif --report-path gitleaks-history.sarif . || true

      - name: Upload full-history SARIF
        if: always() && hashFiles('gitleaks-history.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-history.sarif
          category: gitleaks-history

      - name: Gate on secrets in new commits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # base_ref is a branch name; reject anything that is not ref-safe.
            [[ "${BASE_REF}" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid base ref"; exit 1; }
            git fetch --no-tags origin "${BASE_REF}"
            RANGE="origin/${BASE_REF}..HEAD"
          elif ! [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1"
          else
            [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid head sha"; exit 1; }
            RANGE="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          echo "Scanning commit range: ${RANGE}"
          if gitleaks git --redact --no-banner --log-opts="${RANGE}" \
              --report-format sarif --report-path gitleaks-diff.sarif .; then
            echo "No secrets found in ${RANGE}." >> "$GITHUB_STEP_SUMMARY"
          else
            count=$(jq '[.runs[].results[]?] | length' gitleaks-diff.sarif 2>/dev/null || echo "?")
            {
              echo "### ALERT: gitleaks found ${count} secret(s) in new commits"
              echo ""
              echo "Range: \`${RANGE}\`. See the Security > Code scanning tab for details."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload changed-commits SARIF
        if: always() && hashFiles('gitleaks-diff.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-diff.sarif
          category: gitleaks-diff

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks-*.sarif
          if-no-files-found: ignore
          retention-days: 30

  dependencies:
    name: Dependencies & IaC (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan for HIGH/CRITICAL issues (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: false
          cache: true

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Repo-wide debt gate: runs on main pushes and the weekly schedule, not on
      # PRs. On PRs the same findings are uploaded as SARIF above and GitHub's code
      # scanning check fails the PR only when it *introduces* new alerts, so
      # pre-existing upstream CVEs do not freeze every pull request.
      - name: Gate on fixed HIGH/CRITICAL vulnerabilities and secrets
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-gate.txt
          exit-code: "1"
          cache: true

      - name: Upload gate report
        if: always() && hashFiles('trivy-gate.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-gate-report
          path: trivy-gate.txt
          retention-days: 30

  govulncheck:
    name: Go vulnerabilities (${{ matrix.area }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: lifecycle
            native_deps: true
          - area: controllers
            native_deps: false
          - area: service
            native_deps: false
          - area: webhooks
            native_deps: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install native build dependencies
        if: matrix.native_deps
        run: sudo apt-get update && sudo apt-get install -y libgpgme-dev libbtrfs-dev libdevmapper-dev

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Discover Go modules
        id: modules
        working-directory: ${{ matrix.area }}
        run: |
          set -euo pipefail
          # controllers/ and webhooks/ are go.work workspaces with several leaf
          # modules and no go.mod at the root, so enumerate every module.
          dirs=$(find . -name go.mod \
            -not -path '*/node_modules/*' \
            -not -path '*/testdata/*' \
            -not -path './test/*' \
            -printf '%h\n' | sed 's|^\./||' | sort -u)
          echo "Modules found in ${{ matrix.area }}:"
          echo "${dirs}"
          {
            echo "dirs<<GOVULN_MODULES_EOF"
            echo "${dirs}"
            echo "GOVULN_MODULES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run govulncheck for every module
        id: scan
        env:
          AREA: ${{ matrix.area }}
          MODULES: ${{ steps.modules.outputs.dirs }}
        run: |
          set -uo pipefail
          mkdir -p govuln-sarif
          rm -f govuln-sarif/*.sarif
          reachable=0
          notes=0
          tool_errors=0
          reachable_modules=""
          error_modules=""
          while IFS= read -r mod; do
            [ -n "${mod}" ] || continue
            key="${AREA}_${mod}"
            key=$(printf '%s' "${key}" | tr '/' '_' | tr -c 'A-Za-z0-9_.-' '_')
            echo "::group::govulncheck ${AREA}/${mod}"
            set +e
            ( cd "${AREA}/${mod}" && govulncheck -format sarif ./... \
                > "${GITHUB_WORKSPACE}/govuln-sarif/${key}.sarif" 2> "${RUNNER_TEMP}/${key}.err" )
            rc=$?
            set -e
            if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 3 ]; then
              tool_errors=$((tool_errors + 1))
              error_modules="${error_modules} ${mod}"
              echo "::warning::govulncheck could not analyze ${mod} (exit ${rc})"
              head -n 5 "${RUNNER_TEMP}/${key}.err" || true
            fi
            # SARIF output always exits 0, so classify findings from the report:
            #   level=error -> vulnerable symbol is reachable from the module
            #   level=note  -> dependency is vulnerable but no vulnerable symbol is called
            report="${GITHUB_WORKSPACE}/govuln-sarif/${key}.sarif"
            if jq -e '.runs' "${report}" >/dev/null 2>&1; then
              # govulncheck runs inside the module, so its URIs are module-relative
              # (usually just go.mod). Prefix them so code scanning maps them to
              # files in this repository instead of the repo root.
              if [ "${mod}" = "." ]; then
                prefix="${AREA}/"
              else
                prefix="${AREA}/${mod}/"
              fi
              jq --arg prefix "${prefix}" '
                walk(if type == "object" and (.artifactLocation? | type) == "object"
                       and (.artifactLocation.uri? | type) == "string"
                     then .artifactLocation.uri |=
                       (if test("^[a-zA-Z][a-zA-Z0-9+.-]*:") then .
                        elif startswith($prefix) then .
                        else $prefix + (if startswith("./") then .[2:] else . end) end)
                     else . end)' "${report}" > "${report}.tmp" \
                && mv "${report}.tmp" "${report}"
              found=$(jq '[.runs[].results[]? | select(.level == "error")] | length' "${report}" || echo 0)
              hinted=$(jq '[.runs[].results[]? | select(.level == "note")] | length' "${report}" || echo 0)
              reachable=$((reachable + found))
              notes=$((notes + hinted))
              if [ "${found}" -gt 0 ]; then
                reachable_modules="${reachable_modules} ${mod}"
              fi
              echo "${mod}: ${found} reachable, ${hinted} dependency-only"
            fi
            echo "::endgroup::"
          done <<< "${MODULES}"

          # Drop empty or truncated SARIF left behind by failed runs.
          shopt -s nullglob
          files=(govuln-sarif/*.sarif)
          for f in "${files[@]}"; do
            jq -e '.version and (.runs | type == "array")' "${f}" >/dev/null 2>&1 || rm -f "${f}"
          done
          files=(govuln-sarif/*.sarif)
          if [ "${#files[@]}" -gt 0 ]; then
            jq -s '{version: "2.1.0", "$schema": "https://json.schemastore.org/sarif-2.1.0.json", runs: [.[].runs[]?]}' \
              "${files[@]}" > "govulncheck-${AREA}.sarif"
          else
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' \
              > "govulncheck-${AREA}.sarif"
          fi
          {
            echo "reachable=${reachable}"
            echo "notes=${notes}"
            echo "tool_errors=${tool_errors}"
            echo "reachable_modules=${reachable_modules}"
            echo "error_modules=${error_modules}"
          } >> "$GITHUB_OUTPUT"
          echo "govulncheck: ${reachable} reachable finding(s), ${notes} dependency-only finding(s), ${tool_errors} tooling error(s)"

      # github/codeql-action/upload-sarif refuses more than one run per category, and
      # a merged govulncheck report holds one run per Go module. Push each run through
      # the code scanning API under its own category instead.
      - name: Upload SARIF (one category per module)
        if: always() && hashFiles('govuln-sarif/*.sarif') != ''
        env:
          AREA: ${{ matrix.area }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          status=0
          for f in govuln-sarif/*.sarif; do
            base="govulncheck-${AREA}/$(basename "${f}" .sarif)"
            runs=$(jq '.runs | length' "${f}" 2>/dev/null || echo 0)
            [ "${runs}" -gt 0 ] || { echo "::warning::no SARIF runs in ${f}"; continue; }
            for ((i = 0; i < runs; i++)); do
              cat_name="${base}"
              [ "${runs}" -eq 1 ] || cat_name="${base}-${i}"
              # The code scanning API has no category field: the run's
              # automationDetails.id is what separates analyses.
              jq --argjson i "${i}" --arg cat "${cat_name}" \
                '{version:"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json",
                  runs:[(.runs[$i] + {automationDetails: {id: $cat}})]}' \
                "${f}" > "${RUNNER_TEMP}/upload.sarif"
              # Stage the base64 body in a file: passing it as a jq argument would
              # exceed the per-argument size limit for larger reports.
              gzip -c "${RUNNER_TEMP}/upload.sarif" | base64 -w 0 > "${RUNNER_TEMP}/upload.sarif.b64"
              jq -n \
                --arg sha "${GITHUB_SHA}" \
                --arg ref "${GITHUB_REF}" \
                --rawfile sarif "${RUNNER_TEMP}/upload.sarif.b64" \
                '{commit_sha:$sha, ref:$ref, sarif:$sarif, tool_name:"govulncheck"}' \
                > "${RUNNER_TEMP}/upload.json"
              resp=$(curl -sS --retry 3 --retry-delay 2 -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" \
                --data-binary @"${RUNNER_TEMP}/upload.json") || resp=""
              if [ -n "$(jq -r '.id // empty' <<< "${resp}" 2>/dev/null)" ]; then
                echo "uploaded ${cat_name}: $(jq -r '.id' <<< "${resp}")"
              else
                echo "::warning::SARIF upload failed for ${cat_name}: ${resp}"
                status=1
              fi
            done
          done
          exit "${status}"

      # Repo-wide debt gate, same policy as Trivy: main/schedule only. PRs rely on
      # the code scanning check for newly introduced reachable vulnerabilities.
      - name: Gate on reachable vulnerabilities
        if: github.event_name != 'pull_request' && steps.scan.outputs.reachable != '0'
        run: |
          {
            echo "### ALERT: govulncheck found ${{ steps.scan.outputs.reachable }} reachable vulnerability finding(s) in ${{ matrix.area }}"
            echo ""
            echo "Modules:\`${{ steps.scan.outputs.reachable_modules }}\`"
            echo ""
            echo "Details: Code scanning tab, categories \`govulncheck-${{ matrix.area }}/*\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report tooling gaps
        if: steps.scan.outputs.tool_errors != '0'
        run: echo "::warning::govulncheck skipped modules in ${{ matrix.area }}:${{ steps.scan.outputs.error_modules }}"

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-${{ matrix.area }}
          path: govulncheck-${{ matrix.area }}.sarif
          if-no-files-found: ignore
          retention-days: 30

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build_mode: manual
          - language: javascript-typescript
            build_mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install native build dependencies
        if: matrix.language == 'go'
        run: sudo apt-get update && sudo apt-get install -y libgpgme-dev libbtrfs-dev libdevmapper-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Go modules
        if: matrix.language == 'go'
        run: |
          set -uo pipefail
          # controllers/ and webhooks/ have no go.mod at the root (go.work only),
          # so build every module explicitly.
          while IFS= read -r mod; do
            echo "::group::go build ./... in ${mod}"
            ( cd "${mod}" && go build ./... ) || echo "::warning::go build failed in ${mod}; CodeQL analysis for that module may be partial"
            echo "::endgroup::"
          done < <(find lifecycle controllers service webhooks \
            -name go.mod -not -path '*/testdata/*' -not -path '*/test/*' \
            -printf '%h\n' | sort -u)

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency_review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # GitHub does not build a dependency graph for forks, so this action aborts with
    # "Dependency review is not supported on this repository" here. Keep the job for
    # the case where the graph is available, but never let that abort block a PR:
    # Trivy already gates the same HIGH/CRITICAL dependency surface.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  summary:
    name: Summary
    if: always()
    needs: [secrets, dependencies, govulncheck, codeql, dependency_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write job summary
        run: |
          {
            echo "## Security scan summary"
            echo ""
            echo "| Scan | Result |"
            echo "| --- | --- |"
            echo "| Secrets (gitleaks) | ${{ needs.secrets.result }} |"
            echo "| Dependencies & IaC (Trivy) | ${{ needs.dependencies.result }} |"
            echo "| Go vulnerabilities (govulncheck) | ${{ needs.govulncheck.result }} |"
            echo "| CodeQL | ${{ needs.codeql.result }} |"
            echo "| Dependency review | ${{ needs.dependency_review.result }} |"
            echo ""
            echo "Details: https://github.com/${{ github.repository }}/security/code-scanning"
          } >> "$GITHUB_STEP_SUMMARY"
